<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — BiteBuddy</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAFAFA;
      color: #18181B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid #E4E4E7;
    }
    .emoji {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      color: #18181B;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #71717A;
      margin: 0 0 24px 0;
    }
    button {
      background-color: #FF6B35;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px 0 rgba(255, 107, 53, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>You're currently offline</h1>
    <p>Please check your internet connection. Any meals previously selected remain saved on your device.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
